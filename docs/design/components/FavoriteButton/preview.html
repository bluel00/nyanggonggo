<!-- @dsCard group="Actions" height=220 subtitle="CTA bar: surface + shadow-control · on photo: 40px photo-pill circle (tap to pop)" -->
<div id="r" class="cn-root" style="padding:16px;background:var(--bg)"></div>
<script>
var N=window.CatNotice,h=React.createElement,S=function(t){return h('div',{style:{font:'12px var(--font-sans)',color:'var(--text-2)',margin:'0 0 6px'}},t)};
var Row=function(p){return h('div',{style:{display:'flex',gap:12,alignItems:'center',flexWrap:'wrap',marginBottom:16}},p.children)};
var Col=function(t,c,w){return h('div',{style:{width:w||'auto'}},S(t),c)};
var ph=N.mockPhoto(2,400,300);
function T(p){var s=React.useState(!!p.on),on=s[0],set=s[1];return h(N.FavoriteButton,{onPhoto:p.photo,calm:p.calm,active:on,onToggle:set})}
var Ph=function(c){return h('div',{style:{width:72,height:56,borderRadius:12,backgroundImage:"url('"+ph+"')",backgroundSize:'cover',display:'flex',alignItems:'center',justifyContent:'center'}},c)};
function App(){return h('div',null,
 h(Row,null,Col("CTA bar",h(T)),Col("active",h(N.FavoriteButton,{active:true})),Col("pressed",h(N.FavoriteButton,{className:"cn-pressed"})),Col("disabled",h(N.FavoriteButton,{disabled:true}))),
 h(Row,null,Col("on photo",Ph(h(T,{photo:true}))),Col("on photo, active",Ph(h(T,{photo:true,on:true}))),Col("ended card (fill only)",Ph(h(T,{photo:true,calm:true})))))}
ReactDOM.createRoot(document.getElementById('r')).render(h(App));
</script>
