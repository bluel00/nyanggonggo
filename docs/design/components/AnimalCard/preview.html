var N=window.CatNotice,h=React.createElement,A=N.MOCK_ANIMALS;
var S=function(t){return h('div',{style:{font:'12px var(--font-sans)',color:'var(--text-2)',margin:'0 0 6px'}},t)};
function Card(p){var s=React.useState(!!p.fav),on=s[0],set=s[1];var ended=p.a.status==='ended';
 return h('div',{style:{width:186}},S(p.t),h(N.AnimalCard,{animal:p.a,className:p.cls,action:h(N.FavoriteButton,{onPhoto:true,calm:ended,active:on,onToggle:set})}))}
function App(){return h('div',{style:{display:'flex',gap:12,flexWrap:'wrap'}},
